<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>把三千棵🌳種回來</title>
  <meta name="description" content="查查你家的里，每人分到多少樹蔭、在全市排第幾；也看看哪些空樹穴可以補種，以及 2024 年以來從資料中消失的行道樹。">
  <!-- Link previews (LINE, Facebook, Threads). A shared village links to its own page under v/, whose tags carry that village's card. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="把三千棵🌳種回來">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:url" content="https://sianchen.github.io/taipei-tree-shade/">
  <meta property="og:title" content="把三千棵🌳種回來｜台北的樹蔭，分得公平嗎？">
  <meta property="og:description" content="查查你家的里，每人分到多少樹蔭、在全市排第幾；也看看哪些空樹穴可以補種，以及 2024 年以來從資料中消失的行道樹。">
  <meta property="og:image" content="https://sianchen.github.io/taipei-tree-shade/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="五色鳥在樹蔭下的樹枝上睡覺">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Canonical URL also fixes GoatCounter's path, so share links (?v=...) count as the same page. -->
  <link rel="canonical" href="https://sianchen.github.io/taipei-tree-shade/">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- The first view needs only these two; app.js reuses the responses. -->
  <link rel="preload" href="data/villages.topo.json" as="fetch" crossorigin="anonymous">
  <link rel="preload" href="data/meta.json" as="fetch" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <!-- Huninn (justfont 粉圓) for titles and big numbers; Google Fonts slices it by character, so only the glyphs on the page download. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- In the head with defer, so the scripts download early and run in order after parsing. -->
  <script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script defer src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script defer src="card.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="map" aria-label="台北樹蔭地圖"></div>
  <div id="tooltip" role="status" hidden></div>

  <aside id="panel">
    <button class="sheet-handle" id="sheet-handle" aria-label="展開面板" aria-expanded="false"></button>
    <header>
      <h1>把三千棵<span class="emoji" role="img" aria-label="樹">🌳</span>種回來</h1>
      <p class="sub">台北的樹蔭，分得公平嗎？</p>
      <p class="visits" id="visits" hidden></p>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" data-mode="shade" aria-selected="true">🌳 樹蔭</button>
      <button role="tab" data-mode="pits" aria-selected="false">🌱 補植點</button>
      <button role="tab" data-mode="gone" aria-selected="false">🪵 消失的樹</button>
    </nav>

    <section id="mode-body"></section>

    <section class="locate">
      <button id="locate-btn" class="primary">查我家附近</button>
      <p class="hint">或直接點地圖上的任何一個里</p>
    </section>

    <section id="village-card" hidden></section>

    <section class="basemap">
      <span class="label">底圖</span>
      <div class="seg" role="radiogroup">
        <button data-base="map" aria-checked="true" role="radio">地圖</button>
        <button data-base="photo2024" aria-checked="false" role="radio">113 年航照</button>
        <button data-base="photo2025" aria-checked="false" role="radio">114 年航照</button>
      </div>
    </section>

    <details class="about">
      <summary>資料與方法</summary>
      <div id="about-body"></div>
    </details>
  </aside>

  <script data-goatcounter="https://taipei-tree-shade.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
